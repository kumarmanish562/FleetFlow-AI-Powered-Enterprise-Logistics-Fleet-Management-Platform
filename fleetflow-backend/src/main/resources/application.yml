
  spring:
    application:
      name: fleetflow-backend

    profiles:
      active: ${SPRING_PROFILES_ACTIVE:dev}

    # PostgreSQL Database Configuration
    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5433/fleetflow}
      username: ${DB_USERNAME:fleetflow}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

      hikari:
        maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
        minimum-idle: ${DB_POOL_MIN_IDLE:2}
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000

    # JPA / Hibernate Configuration
    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          format_sql: false
          jdbc:
            time_zone: UTC

    # Flyway Database Migrations
    flyway:
      enabled: true
      locations: classpath:db/migration
      validate-on-migrate: true
      clean-disabled: true

    # Jackson JSON Configuration
    jackson:
      time-zone: UTC

    # Apache Kafka Configuration
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer
        acks: all
        properties:
          enable.idempotence: true
          max.in.flight.requests.per.connection: 5
          delivery.timeout.ms: 120000

      consumer:
        group-id: ${KAFKA_CONSUMER_GROUP:fleetflow-consumers}
        enable-auto-commit: false
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      listener:
        ack-mode: record

    # Email / SMTP Configuration
    mail:
      host: ${MAIL_HOST}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true

    ai:
      model:
        chat: ${SPRING_AI_MODEL_CHAT:none}
        embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      openai:
        api-key: ${OPENAI_API_KEY:}
        timeout: 30s
        max-retries: 1
        chat:
          model: ${AI_MODEL:gpt-4o-mini}
          max-tokens: ${AI_MAX_OUTPUT_TOKENS:500}
        embedding:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
      vectorstore:
        pgvector:
          initialize-schema: false
          dimensions: 1536
          index-type: HNSW
          distance-type: COSINE_DISTANCE
          schema-validation: true

    servlet:
      multipart:
        max-file-size: 20MB
        max-request-size: 22MB

    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:}

  # FleetFlow Application Configuration
  fleetflow:
    # JWT Authentication
    security:
      jwt:
        secret: ${JWT_SECRET}
        access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
        refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

    # Shipment Tracking
    tracking:
      future-tolerance-seconds: 30

    ai:
      enabled: ${FLEETFLOW_AI_ENABLED:false}
      max-message-length: ${AI_MAX_MESSAGE_LENGTH:2000}
      max-requests-per-minute: ${AI_MAX_REQUESTS_PER_MINUTE:10}
      conversation-history-limit: ${AI_CONVERSATION_HISTORY_LIMIT:10}
      conversation-retention-days: ${AI_CONVERSATION_RETENTION_DAYS:90}

    knowledge:
      enabled: ${FLEETFLOW_KNOWLEDGE_ENABLED:false}
      storage-location: ${KNOWLEDGE_STORAGE_PATH:./storage/knowledge}
      max-file-size: 20971520
      max-extracted-characters: 1000000
      chunk-size: 800
      worker-delay-ms: 2000
      max-attempts: 3
      retrieval:
        top-k: 10
        max-context-chunks: 6
        similarity-threshold: 0.7

    # Billing and Pricing
    billing:
      currency: INR
      base-price: 100.00
      price-per-kg: 10.00
      price-per-km: 5.00
      tax-percent: 18.00
      fuel-surcharge-percent: 5.00
      express-surcharge: 100.00
      urgent-surcharge: 200.00
      discount-percent: 5.00

    # Kafka Topic Names
    messaging:
      topics:
        shipment-events: fleetflow.shipment.events.v1
        vehicle-events: fleetflow.vehicle.events.v1
        driver-events: fleetflow.driver.events.v1
        incident-events: fleetflow.incident.events.v1
        shipment-notification-dlt: fleetflow.shipment.notifications.dlt.v1

      # Transactional Outbox Configuration
      outbox:
        poll-delay-ms: 1000
        batch-size: 50
        max-attempts: 10
